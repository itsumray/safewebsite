<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UI Lag Test</title>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding-top: 20%; }
        .box { width: 100px; height: 100px; background: red; margin: 20px auto; animation: pulse 0.5s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); } to { transform: scale(1.2); } }
    </style>
</head>
<body>
    <h1>Testing UI Thread Responsiveness...</h1>
    <div class="box"></div>

    <script>
        function heavyUIThrottler() {
            // Block the main UI thread with intensive math for 200 milliseconds
            const startTime = Date.now();
            while (Date.now() - startTime < 200) {
                Math.sqrt(Math.random() * 100000);
            }

            // Yield control back to the browser for just 1 millisecond so it doesn't crash, then loop again
            setTimeout(heavyUIThrottler, 1);
        }

        // Start the lag loop
        heavyUIThrottler();
    </script>
</body>
</html>
